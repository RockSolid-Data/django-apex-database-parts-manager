<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Database</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #1a1d23;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .container {
    text-align: center;
    max-width: 420px;
    padding: 2rem;
  }
  .icon {
    font-size: 3rem;
    margin-bottom: 1.5rem;
    color: #ffc107;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #f8f9fa;
  }
  .version {
    font-size: 0.85rem;
    color: #6c757d;
    margin-bottom: 2rem;
  }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 1.5rem;
    border: 3px solid #2d3748;
    border-top-color: #ffc107;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 0.95rem;
    color: #94a3b8;
    line-height: 1.6;
  }
  .status-warning {
    color: #f59e0b;
    margin-top: 1rem;
    font-size: 0.85rem;
    display: none;
  }
  .bar-track {
    width: 100%;
    height: 3px;
    background: #2d3748;
    border-radius: 2px;
    margin-top: 2rem;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: #ffc107;
    border-radius: 2px;
    transition: width 0.4s ease;
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">&#9889;</div>
  <h1>Apex Database</h1>
  <div class="version" id="versionLine"></div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Preparing your system&hellip;</div>
  <div class="status-warning" id="warning">
    Setup is taking longer than expected. Please wait&hellip;
  </div>
  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var port = params.get("port") || "8000";
  var ver  = params.get("v");
  var url  = "http://127.0.0.1:" + port + "/";

  if (ver) document.getElementById("versionLine").textContent = "v" + ver;

  var statusEl  = document.getElementById("status");
  var warningEl = document.getElementById("warning");
  var barEl     = document.getElementById("bar");
  var attempts  = 0;
  var maxWait   = 180;

  var messages = [
    "Preparing your system\u2026",
    "Running database setup\u2026",
    "Loading catalog data\u2026",
    "Almost ready\u2026"
  ];

  function poll() {
    attempts++;
    var pct = Math.min(95, (attempts / maxWait) * 100);
    barEl.style.width = pct + "%";

    if (attempts < messages.length * 5) {
      var idx = Math.floor(attempts / 5);
      statusEl.textContent = messages[Math.min(idx, messages.length - 1)];
    }

    if (attempts > 120) {
      warningEl.style.display = "block";
    }

    fetch(url, { mode: "no-cors" })
      .then(function () {
        barEl.style.width = "100%";
        statusEl.textContent = "Ready!";
        setTimeout(function () { window.location.href = url; }, 400);
      })
      .catch(function () {
        if (attempts < maxWait) {
          setTimeout(poll, 1000);
        } else {
          statusEl.textContent = "Could not connect to the server.";
          warningEl.textContent = "Please close this tab and try launching the application again.";
          warningEl.style.display = "block";
          document.getElementById("spinner").style.display = "none";
        }
      });
  }

  setTimeout(poll, 500);
})();
</script>
</body>
</html>

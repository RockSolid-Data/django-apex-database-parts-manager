{% for p in pages %}{% if p is None %}<li class="page-item disabled"><span class="page-link px-2">&hellip;</span></li>{% elif p == current_page %}<li class="page-item active"><span class="page-link js-page-link" data-page="{{ p }}">{{ p }}</span></li>{% else %}<li class="page-item"><a class="page-link js-page-link" data-page="{{ p }}" href="#">{{ p }}</a></li>{% endif %}{% endfor %}
